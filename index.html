<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>deadstock — каталог</title>
<!-- Официальная библиотека Telegram: даёт доступ к кнопкам, теме и открытию чата -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0c0d10; --card:#16181d; --card2:#1d2027; --line:#2a2e37;
  --text:#f2f3f5; --muted:#8b909c; --accent:#4f7cff; --ok:#3ddc97;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}

/* шапка */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);
  padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo i{color:var(--accent);font-style:normal}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.seg{display:flex;gap:18px;padding:0 16px 6px}
.seg button{font-weight:700;font-size:17px;color:var(--muted);padding:4px 0;border-bottom:2px solid transparent}
.seg button.on{color:var(--text);border-color:var(--accent)}
.seg sup{font-size:10px;color:var(--muted);margin-left:2px}
h2{margin:14px 16px 8px;font-size:20px}
.search{margin:6px 16px;display:none}
.search.open{display:block}
.search input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}

/* чипы */
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;white-space:nowrap}
.chip.on{background:var(--text);color:#000;border-color:var(--text);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px;color:var(--muted);font-size:13px}
.bar button{color:var(--text);display:flex;gap:6px;align-items:center}

/* сетка */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.item.dim .ph,.item.dim .meta{opacity:.62}
.item{background:var(--card);border-radius:var(--radius);overflow:hidden;position:relative}
.ph{aspect-ratio:1/1.1;display:grid;place-items:center;font-size:46px;font-weight:800;color:rgba(255,255,255,.85);position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lot{position:absolute;left:8px;top:8px;font-size:11px;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.fav{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:15px}
.fav.on{color:#ff5c7a}
.meta{padding:10px 12px 12px}
.brand{font-size:12px;color:var(--muted)}
.name{font-weight:600;margin:2px 0 6px;min-height:2.6em}
.price{font-weight:800}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;font-weight:700}
.t-common{background:#e9e9ec;color:#000}.t-collab{background:#2e3340;color:#fff}
.t-limited{background:#000;color:#fff;border:1px solid #444}.t-rare{background:var(--accent);color:#fff}
.empty{text-align:center;color:var(--muted);padding:50px 24px}

/* листы (модалки снизу) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;
  background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px 24px;transform:translateY(105%);transition:.28s}
.sheet.open{transform:none}
.sheet h3{margin:0 0 12px;font-size:19px}
.lbl{font-weight:700;margin:16px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:14px}
.opt.on{background:var(--text);color:#000;font-weight:600}
.opt.dis{opacity:.35;text-decoration:line-through}
.btn{width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;margin-top:14px}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn.small{width:auto;padding:10px 16px;margin:0}
.two{display:flex;gap:10px}

/* корзина и форма */
.line{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.line .ph{width:64px;aspect-ratio:1;border-radius:12px;font-size:22px;flex:none}
.line .info{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:10px;margin-top:6px}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--card2)}
.total{display:flex;justify-content:space-between;padding:16px;font-size:18px;font-weight:800}
.form{padding:0 16px}
.form label{display:block;margin:14px 0 6px;color:var(--muted);font-size:13px}
.form input,.form textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.radio{display:flex;gap:12px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-top:8px;align-items:flex-start}
.radio.on{border-color:var(--accent)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px}
.radio.on .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.radio small{display:block;color:var(--muted)}
.radio b{margin-left:auto;font-size:13px;white-space:nowrap}
.note{margin:14px 16px;padding:12px;border-radius:12px;background:var(--card);color:var(--muted);font-size:13px}
.done{text-align:center;padding:50px 24px}
.done .big{font-size:54px}

/* вкладка «Магазин» */
.info-card{margin:0 16px;padding:16px;border-radius:var(--radius);background:var(--card)}
.legend{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.legend .tag{margin:2px 0 0;flex:none}

/* нижнее меню */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(12,13,16,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;padding:10px 0 8px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button.on{color:var(--text)}
.nav .ic{font-size:20px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--text);color:#000;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

/* ============ 3. СОСТОЯНИЕ приложения ============ */
const tg = window.Telegram && Telegram.WebApp;
if (tg){ tg.ready(); tg.expand(); try{tg.setHeaderColor("#0c0d10");tg.setBackgroundColor("#0c0d10");}catch(e){} }

const S = {
  tab:"catalog", stock:"in",          // catalog | fav | cart | shop
  cat:"Все",              // выбранная категория-чип
  q:"", searchOpen:false, // поиск
  f:{sort:"new",rarity:"any",size:null,brand:null}, // фильтры
  fav:load("fav",[]).map(String),     // избранное (id товаров)
  cart:load("cart",[]),   // [{id,size,qty}]
  order:{name:(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||"",
         phone:"",tg:(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.username)||"",
         delivery:"pickup",address:"",comment:""},
  checkout:false, sent:false
};
S.cart=S.cart.filter(l=>PRODUCTS.some(p=>p.id===String(l.id)));

function load(k,d){try{return JSON.parse(localStorage.getItem("shop2_"+k))||d}catch(e){return d}}
function save(){try{localStorage.setItem("shop2_fav",JSON.stringify(S.fav));localStorage.setItem("shop2_cart",JSON.stringify(S.cart))}catch(e){}}

/* ============ 4. ВСПОМОГАТЕЛЬНЫЕ ============ */
const $ = s=>document.querySelector(s);
const price = p => (p.priceFrom?"от ":"")+rub(p.price);
const rub = n => n.toLocaleString("ru-RU")+" "+CONFIG.currency;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = id => PRODUCTS.find(p=>p.id===id);
const cartCount = ()=>S.cart.reduce((a,l)=>a+l.qty,0);
const cartSum = ()=>S.cart.reduce((a,l)=>a+byId(l.id).price*l.qty,0);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}
function haptic(){try{tg&&tg.HapticFeedback.impactOccurred("light")}catch(e){}}

function photo(p,cls=""){
  return `<div class="ph ${cls}" style="background:linear-gradient(145deg,${p.color},#0c0d10 130%)">
    ${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy">`:esc(p.brand.slice(0,2).toUpperCase())}</div>`;
}

/* ============ 5. ФИЛЬТРАЦИЯ ============ */
function list(){
  let r = PRODUCTS.filter(p=>p.status===S.stock);
  if (S.cat!=="Все") r = r.filter(p=>p.cat===S.cat);
  if (S.q) r = r.filter(p=>(p.brand+" "+p.name).toLowerCase().includes(S.q.toLowerCase()));
  if (S.f.rarity!=="any") r = r.filter(p=>p.type===S.f.rarity);
  if (S.f.size) r = r.filter(p=>p.sizes.includes(S.f.size));
  if (S.f.brand) r = r.filter(p=>p.brand===S.f.brand);
  const s=S.f.sort;
  if (s==="cheap") r.sort((a,b)=>a.price-b.price);
  if (s==="exp")   r.sort((a,b)=>b.price-a.price);
  if (s==="rare")  r.sort((a,b)=>["rare","limited","collab","common"].indexOf(a.type)-["rare","limited","collab","common"].indexOf(b.type));
  if (s==="new")   r.sort((a,b)=>(b.new-a.new)||(b.post-a.post)||String(b.id).localeCompare(String(a.id)));
  return r;
}
const activeFilters = ()=>(S.f.rarity!=="any")+(!!S.f.size)+(!!S.f.brand);

/* ============ 6. ОТРИСОВКА ЭКРАНОВ ============ */
function card(p){
  const fav=S.fav.includes(p.id);
  return `<div class="item ${p.status==="arch"?"dim":""}" data-open="${p.id}">
    ${photo(p)}<span class="lot">№${p.id}${p.sold?" · продано":""}</span>
    <button class="fav ${fav?"on":""}" data-fav="${p.id}">${fav?"♥":"♡"}</button>
    <div class="meta"><div class="brand">${esc(p.brand||p.cat)}</div>
      <div class="name">${esc(p.name)}</div>
      <div><span class="price">${price(p)}</span><span class="tag t-${p.type}">${TYPES[p.type]}</span></div>
    </div></div>`;
}
function header(){
  return `<div class="top"><div class="logo">${esc(CONFIG.shopName)}<i>.</i></div>
    <button class="icon-btn" data-act="search">⌕</button></div>
    <div class="search ${S.searchOpen?"open":""}"><input id="q" placeholder="Поиск по бренду или названию" value="${esc(S.q)}"></div>`;
}
function viewCatalog(){
  const cur=PRODUCTS.filter(p=>p.status===S.stock);
  const cats=["Все",...new Set(cur.map(p=>p.cat))];
  const r=list(), n=activeFilters();
  const fresh = S.stock==="in"&&S.cat==="Все"&&!S.q&&!n;
  const news = fresh? r.filter(p=>p.new).slice(0,2):[];
  const rest = fresh? r.filter(p=>!news.includes(p)):r;
  const cnt=k=>PRODUCTS.filter(p=>p.status===k).length;
  return header()+`<div class="seg"><button class="${S.stock==="in"?"on":""}" data-stock="in">В наличии<sup>${cnt("in")}</sup></button>
     <button class="${S.stock==="arch"?"on":""}" data-stock="arch">Архив<sup>${cnt("arch")}</sup></button></div>
   ${news.length?`<h2>Свежее</h2><div class="grid">${news.map(card).join("")}</div>`:""}
   ${S.stock==="arch"?`<div class="note" style="margin-top:6px">В архиве — проданные и прошлые позиции. Похожее можно найти под заказ: напишите менеджеру.</div>`:""}
   <div class="chips" style="margin-top:12px">${cats.map(c=>`<button class="chip ${S.cat===c?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
   <div class="bar"><span>${fresh?`Ещё ${rest.length} вещей`:`Найдено: ${r.length}`}</span>
     <button data-act="filters">⚙ Фильтры${n?` (${n})`:""}</button></div>
   ${r.length?`<div class="grid">${rest.map(card).join("")}</div>`
             :`<div class="empty">Ничего не найдено.<br>Измените фильтры или закажите поиск во вкладке «Магазин».</div>`}`;
}
function viewFav(){
  const r=PRODUCTS.filter(p=>S.fav.includes(p.id));
  return header()+`<h2>Избранное</h2>`+(r.length?`<div class="grid">${r.map(card).join("")}</div>`
    :`<div class="empty">Пока пусто.<br>Нажмите ♡ на карточке, чтобы сохранить вещь.</div>`);
}
function viewCart(){
  if (S.sent) return `<div class="done"><div class="big">✅</div><h2 style="margin:10px 0">Заказ отправлен менеджеру</h2>
    <p style="color:var(--muted)">Если чат не открылся, нажмите кнопку ниже и отправьте сообщение вручную.<br>Менеджер ответит в Telegram, уточнит детали и пришлёт реквизиты для оплаты.</p>
    <button class="btn" data-act="resend">Открыть чат с менеджером</button>
    <button class="btn ghost" data-act="newOrder">Вернуться в каталог</button></div>`;
  if (!S.cart.length) return header()+`<h2>Корзина</h2><div class="empty">Корзина пуста.<br>Выберите вещь в каталоге.</div>`;
  const lines=S.cart.map((l,i)=>{const p=byId(l.id);return `<div class="line">${photo(p)}
    <div class="info"><div class="brand">${esc(p.brand)} · размер ${esc(l.size)}</div><div class="name" style="min-height:0">${esc(p.name)}</div>
    <div class="price">${price(p)}</div>
    <div class="qty"><button data-q="${i}" data-d="-1">−</button><b>${l.qty}</b><button data-q="${i}" data-d="1">+</button></div></div>
    <button data-del="${i}" style="color:var(--muted);font-size:20px">✕</button></div>`}).join("");
  if (!S.checkout) return header()+`<h2>Корзина</h2>${lines}
    ${S.cart.some(l=>byId(l.id).priceFrom)?`<div class="note">Цена части вещей зависит от размера — итоговую сумму подтвердит менеджер.</div>`:""}
    <div class="total"><span>Итого</span><span>${rub(cartSum())}</span></div>
    <div style="padding:0 16px"><button class="btn" data-act="checkout">Оформить заказ</button></div>`;
  const o=S.order;
  return `<div class="top"><button class="icon-btn" data-act="back">‹</button><div class="logo" style="font-size:18px">Оформление</div><span style="width:38px"></span></div>
   <div class="form">
    <label>Имя</label><input id="o_name" value="${esc(o.name)}" placeholder="Как к вам обращаться">

    <label>Telegram для связи (необязательно)</label><input id="o_tg" value="${esc(o.tg)}" placeholder="@username">
    <div class="lbl">Получение</div>
    ${CONFIG.delivery.map(d=>`<div class="radio ${o.delivery===d.id?"on":""}" data-del-opt="${d.id}"><span class="dot"></span>
       <div>${esc(d.title)}<small>${esc(d.note)}</small></div><b>${esc(d.price)}</b></div>`).join("")}
    ${o.delivery!=="pickup"?`<label>Город и адрес или пункт выдачи</label><input id="o_addr" value="${esc(o.address)}" placeholder="Город, улица, дом">`:""}
    <label>Комментарий</label><textarea id="o_com" rows="2" placeholder="Размер, удобное время, вопросы">${esc(o.comment)}</textarea>
   </div>
   <div class="note">💬 Онлайн-оплаты нет. Заказ уйдёт менеджеру в Telegram, он подтвердит наличие и пришлёт реквизиты или ссылку на оплату.</div>
   <div class="total"><span>Итого</span><span>${rub(cartSum())}</span></div>
   <div style="padding:0 16px"><button class="btn" data-act="send">Отправить заказ менеджеру</button></div>`;

   </div>
   <h2>Как читать метку</h2><div class="info-card">
     ${Object.keys(TYPES).map(k=>`<div class="legend"><span class="tag t-${k}">${TYPES[k]}</span><span>${TYPE_DESC[k]}</span></div>`).join("")}
   </div>
   <h2>Нужно то, чего нет в наличии?</h2><div class="info-card"><div style="color:var(--muted);margin-bottom:10px">Опишите вещь или пришлите ссылку. Найдём и привезём под заказ.</div>
     <button class="btn ghost" style="margin:0" data-act="search-order">Заказать поиск</button></div>`;
}
function render(){
  const v={catalog:viewCatalog,fav:viewFav,cart:viewCart,shop:viewShop}[S.tab]();
  const keep = document.activeElement && document.activeElement.id;
  $("#app").innerHTML = v+`<div class="nav"><div class="nav-in">
    ${[["catalog","▦","Каталог"],["fav","♡","Избранное"],["cart","🛍","Корзина"],["shop","⌂","Магазин"]].map(([k,i,t])=>
      `<button class="${S.tab===k?"on":""}" data-tab="${k}"><span class="ic">${i}</span>${t}
       ${k==="cart"&&cartCount()?`<span class="badge">${cartCount()}</span>`:""}${k==="fav"&&S.fav.length?`<span class="badge">${S.fav.length}</span>`:""}</button>`).join("")}
    </div></div>`;
  if (keep && $("#"+keep)) { const e=$("#"+keep); e.focus(); try{e.setSelectionRange(e.value.length,e.value.length)}catch(_){} }
}

/* ============ 7. ЛИСТЫ: карточка товара и фильтры ============ */
function openSheet(html){ $("#sheet").innerHTML=html; $("#bg").classList.add("open"); requestAnimationFrame(()=>$("#sheet").classList.add("open")); }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#bg").classList.remove("open"); }
let pick=null; // выбранный размер в карточке
function openProduct(id){
  const p=byId(id); pick=p.sizes.length?null:"уточнить у менеджера";
  const gone=p.status==="arch";
  openSheet(`${photo(p)}<div style="padding-top:12px">
    <div class="brand">${esc(p.brand||p.cat)} · №${esc(p.id)}</div>
    <h3 style="margin:4px 0">${esc(p.name)} <span class="tag t-${p.type}">${TYPES[p.type]}</span></h3>
    <div class="price" style="font-size:22px">${price(p)}</div>
    ${p.sizes.length?`<div class="lbl">Размер</div><div class="row" id="sizes">${p.sizes.map(s=>`<button class="opt" data-size="${esc(s)}">${esc(s)}</button>`).join("")}</div>`
      :`<div class="lbl">Размер</div><div style="color:var(--muted)">${p.sizeNote?esc(p.sizeNote):"Размер уточняйте у менеджера"}</div>`}
    ${p.sizes.length&&p.sizeNote&&/под заказ|зависит|факт/i.test(p.sizeNote)?`<div style="color:var(--muted);margin-top:8px;font-size:13px">${esc(p.sizeNote)}</div>`:""}
    <div style="color:var(--muted);margin-top:12px;font-size:13px">${TYPE_DESC[p.type]}</div>
    ${gone?`<div class="note" style="margin:14px 0 0">${p.sold?"Продано.":"Архивная позиция."} Можно спросить, есть ли похожее или можно ли привезти под заказ.</div>`
          :`<button class="btn" data-add="${esc(p.id)}">Добавить в корзину</button>`}
    <button class="btn ghost" data-ask="${esc(p.id)}">${gone?"Спросить у менеджера":"Задать вопрос менеджеру"}</button>
    <a href="https://t.me/${CONFIG.channel}/${p.post}" target="_blank" style="display:block;text-align:center;margin-top:12px;color:var(--muted);font-size:13px">Пост в канале</a></div>`);
}
function openFilters(){
  const brands=[...new Set(PRODUCTS.filter(p=>p.status===S.stock&&p.brand).map(p=>p.brand))].sort();
  const sizes=[...new Set(PRODUCTS.filter(p=>p.status===S.stock).flatMap(p=>p.sizes))].sort((a,b)=>(+a||99)-(+b||99)||a.localeCompare(b));
  const o=(grp,val,label,on)=>`<button class="opt ${on?"on":""}" data-f="${grp}" data-v="${esc(val)}">${esc(label)}</button>`;
  openSheet(`<h3>Фильтры</h3>
   <div class="lbl">Сортировка</div><div class="row">${[["new","Сначала новые"],["cheap","Дешевле"],["exp","Дороже"],["rare","Редкие вперёд"]].map(([v,l])=>o("sort",v,l,S.f.sort===v)).join("")}</div>
   <div class="lbl">Редкость</div><div class="row">${o("rarity","any","Любая",S.f.rarity==="any")}${Object.keys(TYPES).map(k=>o("rarity",k,TYPES[k],S.f.rarity===k)).join("")}</div>
   <div class="lbl">Размер</div><div class="row">${sizes.map(s=>o("size",s,s,S.f.size===s)).join("")}</div>
   <div class="lbl">Бренд</div><div class="row">${brands.map(b=>o("brand",b,b,S.f.brand===b)).join("")}</div>
   <div class="two"><button class="btn ghost" data-act="reset">Сбросить</button><button class="btn" data-act="apply">Показать ${list().length}</button></div>`);
}

/* ============ 8. ОТПРАВКА ЗАКАЗА МЕНЕДЖЕРУ ============ */
function orderText(){
  const o=S.order, d=CONFIG.delivery.find(x=>x.id===o.delivery);
  const items=S.cart.map((l,i)=>{const p=byId(l.id);return `${i+1}. ${p.name.toLowerCase().startsWith((p.brand||'').toLowerCase())?'':p.brand+' '}${p.name} (№${p.id}), размер ${l.size}, ${l.qty} шт. — ${rub(p.price*l.qty)}`}).join("\n");
  return `Здравствуйте! Хочу оформить заказ:\n\n${items}\n\nИтого: ${rub(cartSum())}\n\nИмя: ${o.name}\nТелефон: ${o.phone}`
   +(o.tg?`\nTelegram: ${o.tg.startsWith("@")?o.tg:"@"+o.tg}`:"")+`\nПолучение: ${d.title}`
   +(o.address?`\nАдрес: ${o.address}`:"")+(o.comment?`\nКомментарий: ${o.comment}`:"");
}
function openManager(text){
  const url=`https://t.me/${CONFIG.manager}${text?`?text=${encodeURIComponent(text)}`:""}`;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url,"_blank");
}

/* ============ 9. ОБРАБОТКА КЛИКОВ (одна точка входа на всё приложение) ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-stock],[data-cat],[data-fav],[data-open],[data-act],[data-size],[data-add],[data-ask],[data-f],[data-q],[data-del],[data-del-opt]");
  if (e.target.id==="bg"){closeSheet();return}
  if (!t) return;
  const d=t.dataset;
  if (d.tab){S.tab=d.tab;S.checkout=false;if(d.tab!=="cart")S.sent=false;window.scrollTo(0,0);render();return}
  if (d.stock){S.stock=d.stock;S.cat="Все";render();return}
  if (d.cat){S.cat=d.cat;render();return}
  if (d.fav){e.stopPropagation();const id=d.fav,i=S.fav.indexOf(id);i<0?S.fav.push(id):S.fav.splice(i,1);save();haptic();render();return}
  if (d.open){openProduct(d.open);return}
  if (d.size){pick=d.size;document.querySelectorAll("#sizes .opt").forEach(b=>b.classList.toggle("on",b.dataset.size===pick));return}
  if (d.add){ if(!pick){toast("Выберите размер");return}
    const ex=S.cart.find(l=>l.id===d.add&&l.size===pick); ex?ex.qty++:S.cart.push({id:d.add,size:pick,qty:1});
    save();haptic();closeSheet();toast("Добавлено в корзину");render();return}
  if (d.ask){const p=byId(d.ask);openManager(`Здравствуйте! Вопрос по вещи: ${p.name.toLowerCase().startsWith((p.brand||'').toLowerCase())?'':p.brand+' '}${p.name} (№${p.id}).`);return}
  if (d.f){ if(d.f==="sort"||d.f==="rarity") S.f[d.f]=d.v; else S.f[d.f]=(S.f[d.f]===d.v?null:d.v); openFilters();return}
  if (d.q!==undefined){const l=S.cart[+d.q];l.qty+=+d.d;if(l.qty<1)S.cart.splice(+d.q,1);save();render();return}
  if (d.del!==undefined){S.cart.splice(+d.del,1);save();render();return}
  if (d.delOpt){S.order.delivery=d.delOpt;render();return}
  switch(d.act){
    case "search": S.searchOpen=!S.searchOpen; if(S.tab!=="catalog")S.tab="catalog"; render(); if(S.searchOpen)$("#q")&&$("#q").focus(); break;
    case "filters": openFilters(); break;
    case "apply": closeSheet(); render(); break;
    case "reset": S.f={sort:"new",rarity:"any",size:null,brand:null}; openFilters(); break;
    case "checkout": S.checkout=true; window.scrollTo(0,0); render(); break;
    case "back": S.checkout=false; render(); break;
    case "send":{
      const o=S.order;
      if(!o.name.trim()){toast("Укажите имя");return}
      if(o.phone.replace(/\D/g,"").length<10){toast("Проверьте телефон");return}
      if(o.delivery!=="pickup"&&!o.address.trim()){toast("Укажите адрес");return}
      openManager(orderText()); S.sent=true; render(); break;}
    case "resend": openManager(orderText()); break;
    case "newOrder": S.cart=[];save();S.sent=false;S.checkout=false;S.tab="catalog";render(); break;
    case "manager": openManager("Здравствуйте! У меня вопрос."); break;
    case "channel": { const u=`https://t.me/${CONFIG.channel}`; tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,"_blank"); break;}
    case "search-order": openManager("Здравствуйте! Ищу вещь, которой нет в каталоге:\n"); break;
  }
});
/* ввод текста: сохраняем в состояние, не перерисовывая экран (иначе пропадёт клавиатура) */
document.addEventListener("input",e=>{
  const id=e.target.id, v=e.target.value;
  if(id==="q"){S.q=v;render()} else if(id==="o_name")S.order.name=v; else if(id==="o_phone")S.order.phone=v;
  else if(id==="o_tg")S.order.tg=v; else if(id==="o_addr")S.order.address=v; else if(id==="o_com")S.order.comment=v;
});
render();
</script>
</body>
</html>
